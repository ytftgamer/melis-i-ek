<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mavi Ortanca</title>
<style>
  :root { --mesaj-rengi: #cfe3ff; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 30%, #1b2a55 0%, #0e1530 55%, #070b1c 100%);
    font-family: "Georgia", "Times New Roman", serif;
    color: var(--mesaj-rengi);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden; min-height: 100vh;
  }
  #parcaciklar { position: fixed; inset: 0; pointer-events: none; }
  .sahne { position: relative; width: min(92vw, 520px); }
  svg { width: 100%; height: auto; display: block; overflow: visible; }

  /* Sap çizilir */
  .sap { stroke-dasharray: 400; stroke-dashoffset: 400; animation: ciz 1.6s ease-out forwards; }
  @keyframes ciz { to { stroke-dashoffset: 0; } }

  /* Yapraklar büyür */
  .yaprak {
    transform-box: fill-box; transform-origin: 0% 100%;
    transform: scale(0); animation: yaprak 1.2s cubic-bezier(.2,.9,.3,1.2) forwards;
  }
  .yaprak.sag { transform-origin: 100% 100%; }
  @keyframes yaprak { to { transform: scale(1); } }

  /* Çiçekçikler açılır */
  .cicek {
    transform-box: fill-box; transform-origin: center;
    transform: scale(0) rotate(-90deg); opacity: 0;
    animation: ac 1.1s cubic-bezier(.2,.9,.3,1.25) forwards;
  }
  @keyframes ac {
    60%  { opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  /* Açtıktan sonra hafif nefes alma */
  .nefes { transform-box: fill-box; transform-origin: center; animation: nefes 4s ease-in-out infinite; }
  @keyframes nefes { 50% { transform: scale(1.035) rotate(.6deg); } }

  .salin { transform-box: view-box; transform-origin: 260px 480px; animation: salin 6s ease-in-out infinite; }
  @keyframes salin { 50% { transform: rotate(1.2deg); } }

  .yazi {
    text-align: center; margin-top: 8px; padding: 0 20px;
    opacity: 0; transform: translateY(12px);
    transition: opacity 1.8s ease, transform 1.8s ease;
  }
  .yazi.goster { opacity: 1; transform: none; }
  .yazi h1 { font-weight: normal; font-style: italic; font-size: clamp(22px, 5.5vw, 34px); letter-spacing: .5px; }
  .yazi p { margin-top: 8px; font-size: clamp(14px, 3.6vw, 17px); opacity: .75; }
  button {
    margin-top: 18px; background: transparent; color: var(--mesaj-rengi);
    border: 1px solid rgba(207,227,255,.4); border-radius: 999px;
    padding: 8px 20px; font-family: inherit; font-size: 14px; cursor: pointer;
    opacity: 0; transition: opacity 1.8s ease, background .3s;
  }
  button.goster { opacity: 1; }
  button:hover { background: rgba(207,227,255,.12); }
</style>
</head>
<body>
<canvas id="parcaciklar"></canvas>

<div class="sahne">
  <svg id="svg" viewBox="0 0 520 560" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="glow" cx="50%" cy="40%" r="50%">
        <stop offset="0%" stop-color="#6fa8ff" stop-opacity=".35"/>
        <stop offset="100%" stop-color="#6fa8ff" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="yaprakG" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#3f9a6a"/>
        <stop offset="100%" stop-color="#1d5a40"/>
      </linearGradient>
    </defs>
    <circle cx="260" cy="230" r="250" fill="url(#glow)"/>
    <g class="salin" id="bitki"></g>
  </svg>

  <div class="yazi" id="yazi">
    <h1 id="baslik"></h1>
    <p id="alt"></p>
    <button id="tekrar">Tekrar aç 🌸</button>
  </div>
</div>

<script>
/* ====== BURAYI KENDİNE GÖRE DEĞİŞTİR ====== */
const BASLIK = "Sana küçük bir ortanca 💙";
const ALT    = "Bu seferlik böyle olsun. bir dahakine gerçeğini olmasi dileğiyle .";
/* ========================================= */

const NS = "http://www.w3.org/2000/svg";
const bitki = document.getElementById("bitki");
const yazi = document.getElementById("yazi");
const tekrarBtn = document.getElementById("tekrar");
document.getElementById("baslik").textContent = BASLIK;
document.getElementById("alt").textContent = ALT;

const mavi = ["#4f7dff", "#5b8cff", "#6a9bff", "#7aa9ff", "#8bb6ff", "#9fc4ff", "#5a6ee8", "#7a86f0", "#a9b8ff"];
const rastgele = (a, b) => a + Math.random() * (b - a);
const sec = arr => arr[Math.floor(Math.random() * arr.length)];

function el(ad, ozellikler, ebeveyn) {
  const e = document.createElementNS(NS, ad);
  for (const k in ozellikler) e.setAttribute(k, ozellikler[k]);
  (ebeveyn || bitki).appendChild(e);
  return e;
}

function kur() {
  bitki.innerHTML = "";
  yazi.classList.remove("goster");
  tekrarBtn.classList.remove("goster");

  // Sap
  el("path", {
    d: "M260 540 C 258 480, 262 430, 260 360",
    stroke: "#2f7a55", "stroke-width": 7, fill: "none", "stroke-linecap": "round", class: "sap"
  });

  // Yapraklar
  const sol = el("path", {
    d: "M260 470 C 200 450, 150 470, 120 420 C 175 400, 235 420, 260 470 Z",
    fill: "url(#yaprakG)", class: "yaprak"
  });
  sol.style.animationDelay = "1.0s";
  const sag = el("path", {
    d: "M260 440 C 320 420, 370 440, 405 390 C 345 372, 285 390, 260 440 Z",
    fill: "url(#yaprakG)", class: "yaprak sag"
  });
  sag.style.animationDelay = "1.3s";

  // Çiçek kümesi: ayçiçeği (phyllotaxis) dizilimiyle kubbe şekli
  const cx = 260, cy = 215, R = 150, N = 110;
  const altin = Math.PI * (3 - Math.sqrt(5));
  const noktalar = [];
  for (let i = 0; i < N; i++) {
    const r = R * Math.sqrt((i + .5) / N);
    const a = i * altin;
    // Üst kısım yuvarlak, alt kısım hafif basık
    const x = cx + r * Math.cos(a);
    let y = cy + r * Math.sin(a) * (Math.sin(a) > 0 ? .82 : 1);
    noktalar.push({ x, y, r });
  }
  // Dıştan içe çiz: içtekiler üstte görünsün
  noktalar.sort((p, q) => q.r - p.r);

  const grup = el("g", {});
  noktalar.forEach((p, i) => {
    const boy = rastgele(22, 30) * (1 - .18 * (p.r / R));
    const donus = rastgele(0, 90);
    const renk = sec(mavi);
    const g = el("g", { transform: `translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${donus.toFixed(0)})` }, grup);
    const ic = el("g", { class: "cicek" }, g);
    // Açılma sırası: merkezden dışa doğru
    const sira = (p.r / R);
    ic.style.animationDelay = (1.8 + sira * 2.6 + rastgele(0, .35)).toFixed(2) + "s";
    const nefes = el("g", { class: "nefes" }, ic);
    nefes.style.animationDelay = (rastgele(0, 3)).toFixed(2) + "s";
    // 4 yaprak
    for (let k = 0; k < 4; k++) {
      el("ellipse", {
        cx: 0, cy: -boy * .42, rx: boy * .38, ry: boy * .52,
        fill: renk, "fill-opacity": .94,
        stroke: "#ffffff", "stroke-opacity": .28, "stroke-width": .8,
        transform: `rotate(${k * 90})`
      }, nefes);
    }
    // Orta
    el("circle", { r: boy * .1, fill: "#e9f1ff", "fill-opacity": .9 }, nefes);
  });

  // Yazıyı göster
  setTimeout(() => yazi.classList.add("goster"), 5200);
  setTimeout(() => tekrarBtn.classList.add("goster"), 6200);
}

tekrarBtn.addEventListener("click", kur);

/* Havada uçuşan ışık parçacıkları */
const cv = document.getElementById("parcaciklar");
const cx2 = cv.getContext("2d");
let P = [];
function boyutla() {
  cv.width = innerWidth; cv.height = innerHeight;
  P = Array.from({ length: 45 }, () => ({
    x: Math.random() * cv.width, y: Math.random() * cv.height,
    r: rastgele(.8, 2.6), v: rastgele(.15, .5), s: rastgele(0, 6.28)
  }));
}
addEventListener("resize", boyutla);
boyutla();
(function don(t) {
  cx2.clearRect(0, 0, cv.width, cv.height);
  for (const p of P) {
    p.y -= p.v; p.x += Math.sin(t / 1500 + p.s) * .25;
    if (p.y < -5) { p.y = cv.height + 5; p.x = Math.random() * cv.width; }
    cx2.beginPath();
    cx2.arc(p.x, p.y, p.r, 0, 6.283);
    cx2.fillStyle = `rgba(160,200,255,${.25 + .25 * Math.sin(t / 700 + p.s)})`;
    cx2.fill();
  }
  requestAnimationFrame(don);
})(0);

kur();
</script>
</body>
</html>
